name = "nag-bot"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Chats the bot will answer (comma-separated Telegram chat ids). Updates from
# any other chat — including stranger DMs — are ignored before touching D1/AI.
[vars]
# -1004418632524 is the supergroup the original basic group (-435466607) was
# upgraded to when an admin was promoted. The upgrade mints a new id; the old
# one is a dead husk and is deliberately not listed.
ALLOWED_CHATS = "-1004418632524"

# Secrets set with `wrangler secret put`: BOT_TOKEN, WEBHOOK_SECRET, and
# ADMIN_SECRET. Keep ADMIN_SECRET separate from Telegram's webhook secret.

# Fires the scheduled handler every minute to send due reminders and re-nags.
[triggers]
crons = ["* * * * *"]

# The Worker executes where Telegram's webhooks land — Amsterdam — so the
# database lives in WEUR to sit beside it (measured on squashbot: APAC D1 cost
# ~200ms per query from AMS). The original APAC database (nagbot,
# d5ffcebe-7dff-4ada-8ae4-925b0175c3a8) is kept as a backup of the
# pre-migration state; backup-20260817.sql is the export that seeded this.
[[d1_databases]]
binding = "DB"
database_name = "nagbot-eu"
database_id = "24e45c9c-75bf-4b7e-b38e-f92598c370fe"

# Vision model for /autotag (classifying which cat is on each sticker).
[ai]
binding = "AI"

# Persisted Workers Logs, so "why didn't it nag?" is answerable after the fact.
[observability]
enabled = true
